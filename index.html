<script>
const $=s=>document.querySelector(s),money=n=>'$'+Math.round(n).toLocaleString('es-AR'),hoy=()=>new Date().toLocaleDateString('es-AR');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cl=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,typeof v=='string'&&k!='code'?esc(v):v])),fd=d=>new Date(d).toLocaleDateString('es-AR');

<div class="card"><h2>Stock vs. mínimo <small>(barra = stock, línea roja = mínimo)</small></h2>${P.map(p=>{const m=Math.max(p.stock,p.min)*1.25;return`<div class="br"><i>${p.name}</i><div class="tr"><u style="width:${p.stock/m*100}%;background:${p.stock<=p.min?'var(--r)':'var(--a)'}"></u><s style="left:${p.min/m*100}%"></s></div><b>${p.stock}/${p.min}</b></div>`}).join('')}</div>

Stock(){const a=rol=='Administrador';return`${tcCard()}${a&&ed&&pf(ed)?editCard():''}${rol!='Caja'?`<div class="card"><h2>Nuevo repuesto</h2><div class="f"><label>Código<input id="np0" style="width:90px"></label><label>Nombre<input id="np1"></label><label>Categoría<input id="np2" style="width:110px"></label><label>Ubicación<input id="np3" style="width:70px"></label><label>Stock inicial<input id="np4" type="number" value="0" style="width:80px"></label><label>Mínimo<input id="np5" type="number" value="0" style="width:70px"></label><label>Costo<input id="np6" type="number" style="width:90px"></label><label>Precio<input id="np7" type="number" style="width:90px"></label><label>Proveedor<input id="np8" style="width:130px"></label><label>Moneda<select id="np9"><option value="ARS">Pesos</option><option value="USD">Dólares</option></select></label><button class="p" onclick="addP()">Agregar</button></div></div>`:''}<div class="card"><div class="f"><label>Buscar<input id="q" oninput="fs()" placeholder="código, nombre, categoría"></label>${a?`<button onclick="expX()">⬇ Exportar Excel</button><label>Importar Excel<input type="file" accept=".xlsx,.xls,.csv" onchange="impX(this)"></label>`:''}</div><small>Columnas para importar: code, name, cat, loc, stock, min, cost, price, prov, moneda (ARS o USD)</small><div class="w"><table><thead><tr><th>Código</th><th>Repuesto</th><th>Ubic.</th><th>Stock</th><th>Mín.</th>${rol!='Vendedor'?'<th>Costo</th>':''}<th>Precio</th>${a?'<th></th>':''}</tr></thead><tbody id="tb">${rows('')}</tbody></table></div></div>`},
Cotizar(){return`<div class="card"><h2>Nueva cotización</h2><div class="f"><label>Cliente<input id="dc" value="${dr.cli}" oninput="dr.cli=this.value" placeholder="Nombre / teléfono"></label><label>Repuesto<select id="dp">${popts()}</select></label><label>Cant.<input id="dq" type="number" min="1" value="1" style="width:70px"></label><button onclick="addI()">+ Agregar</button></div>
<div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Disponible</th><th>Subtotal</th><th></th></tr>${dr.items.map((i,n)=>{const p=pf(i.code);return`<tr><td>${p.name}</td><td>${i.q}</td><td class="${p.stock<i.q?'rd':'gn'}">${p.stock<i.q?'Faltan '+(i.q-Math.max(p.stock,0)):'En stock ('+p.stock+')'}</td><td>${money(p.price*i.q)}</td><td><button onclick="dr.items.splice(${n},1);draw()">✕</button></td></tr>`}).join('')}<tr><td colspan=3><b>Total</b></td><td><b>${money(dr.items.reduce((s,i)=>s+pf(i.code).price*i.q,0))}</b></td><td></td></tr></table></div><br>
<h2>Acuerdo con el cliente <small>(obligatorio)</small></h2><div class="f"><label>Forma de pago<select onchange="dr.pago=this.value"><option value="">— elegir —</option>${opts(PAGOS,dr.pago)}</select></label><label>Plazo de entrega<select onchange="dr.plazo=this.value"><option value="">— elegir —</option>${opts(PLAZOS,dr.plazo)}</select></label><label>Validez<input value="${dr.valid}" oninput="dr.valid=this.value" style="width:110px"></label></div><label style="display:block"><small>Condiciones / descuentos acordados</small><textarea style="width:100%" rows="2" oninput="dr.nota=this.value">${dr.nota}</textarea></label><br><button class="p" onclick="emit()">Emitir cotización</button></div>
<div class="card"><h2>Cotizaciones</h2><div class="w"><table><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Acuerdo</th><th>Estado</th><th></th></tr>${Q.map(q=>`<tr><td>${q.id}</td><td>${q.f}</td><td>${q.cli}</td><td>${money(q.t)}</td><td><small>${q.pago} · ${q.plazo} · válida ${q.valid}${q.nota?' · '+q.nota:''}<br>por ${q.u}</small></td><td><span class="bd">${q.est}</span></td><td>${q.est=='Emitida'?`<button onclick="vender(${q.id})">Vender</button> <button onclick="perder(${q.id})">Perdida</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin cotizaciones</td></tr>'}</table></div></div>`},
Faltantes(){return`<div class="card"><h2>Registrar faltante (interno)</h2><div class="f"><label>Cliente<input id="fc"></label><label>Repuesto<select id="fp">${popts()}</select></label><label>Cant. pedida<input id="fq" type="number" value="1" style="width:80px"></label><label>Pago acordado<select id="fg">${opts(PAGOS)}</select></label><label>Seña $<input id="fs" type="number" value="0" style="width:90px"></label><label>Plazo prometido<select id="fz">${opts(PLAZOS)}</select></label><button class="p" onclick="addF()">Registrar</button></div></div>
<div class="card"><h2>Faltantes y pedidos pendientes</h2><div class="w"><table><tr><th>Fecha</th><th>Cliente</th><th>Repuesto</th><th>Pidió / faltó</th><th>Pago acordado</th><th>Seña</th><th>Plazo</th><th>Estado</th><th></th></tr>${F.map((f,n)=>`<tr><td>${f.f}</td><td>${f.cli}</td><td>${pf(f.code).name}</td><td>${f.q}</td><td>${f.pago}</td><td>${money(f.sena)}</td><td>${f.plazo}</td><td><span class="bd">${f.est}</span></td><td>${f.est=='Pendiente'?`<button onclick="upd('faltantes',${f.id},{estado:'Resuelto'})">Resolver</button>`:''}</td></tr>`).join('')||'<tr><td colspan=9>Sin faltantes</td></tr>'}</table></div></div>`},
Compras(){const cj=rol=='Caja';return`${cj?'':`<div class="card"><h2>Nueva orden de compra</h2><div class="f"><label>Repuesto<select id="cp" onchange="cf()">${popts()}</select></label><label>Cant.<input id="cq" type="number" min="1" value="1" style="width:70px"></label><label>Costo unit.<input id="cc" type="number" style="width:100px" value="${(P[0]||{cost:0}).cost}"></label><button onclick="addCI()">+ Agregar</button></div><div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Costo</th><th>Subtotal</th><th></th></tr>${cd.items.map((i,n)=>`<tr><td>${pf(i.code).name}</td><td>${i.q}</td><td>${money(i.cost)}</td><td>${money(i.q*i.cost)}</td><td><button onclick="cd.items.splice(${n},1);draw()">✕</button></td></tr>`).join('')}<tr><td colspan=3><b>Total</b></td><td colspan=2><b>${money(tot(cd))}</b></td></tr></table></div><br><div class="f"><label>Proveedor<input value="${cd.prov}" oninput="cd.prov=this.value"></label><label>Pago pactado<select onchange="cd.pago=this.value">${opts(PAGOS,cd.pago)}</select></label><label>Plazo<select onchange="cd.plazo=this.value">${opts(PLAZOS,cd.plazo)}</select></label><button class="p" onclick="addC()">Crear orden</button></div></div>`}<div class="card"><h2>Órdenes de compra</h2><div class="w"><table><tr><th>Fecha</th><th>Proveedor</th><th>Artículos</th><th>Total</th><th>Pago / plazo</th><th>Estado</th><th></th></tr>${C.map((c,n)=>`<tr><td>${c.f}</td><td>${c.prov}</td><td>${its(c)}</td><td>${money(tot(c))}</td><td><small>${c.pago} · ${c.plazo}</small></td><td><span class="bd">${c.est}</span> <span class="bd">${c.pg}</span></td><td>${c.est=='Pedida'&&!cj?`<button onclick="recibir(${c.id})">Recibir</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin órdenes</td></tr>'}</table></div></div>`},
Caja(){return`<div class="card"><h2>Cobros</h2><div class="w"><table><tr><th>Fecha</th><th>Cliente</th><th>Cotiz.</th><th>Forma de pago</th><th>Total</th><th>Estado</th><th></th></tr>${CB.map((c,n)=>`<tr><td>${c.f}</td><td>${c.cli}</td><td>${c.q}</td><td>${c.pago}</td><td>${money(c.t)}</td><td><span class="bd">${c.est}</span></td><td>${c.est=='Pendiente'?`<button onclick="upd('cobros',${c.id},{estado:'Cobrado'})">Cobrar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin cobros</td></tr>'}</table></div></div><div class="card"><h2>Pagos a proveedores</h2><div class="w"><table><tr><th>Fecha</th><th>Repuesto</th><th>Pago pactado</th><th>Total</th><th>Recepción</th><th>Pago</th><th></th></tr>${C.map((c,n)=>`<tr><td>${c.f}</td><td>${its(c)}</td><td>${c.pago}</td><td>${money(tot(c))}</td><td>${c.est}</td><td><span class="bd">${c.pg}</span></td><td>${c.pg=='Impago'?`<button onclick="upd('compras',${c.id},{pg:'Pagado'})">Registrar pago</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin compras</td></tr>'}</table></div></div>`},

function rows(f){f=f.toLowerCase();const a=rol=='Administrador';return P.filter(p=>(p.code+p.name+p.cat).toLowerCase().includes(f)).map(p=>`<tr><td>${p.code}</td><td>${p.name}<br><small>${p.cat} · ${p.prov}</small></td><td>${p.loc}</td><td class="${p.stock<=p.min?'rd':''}"><b>${p.stock}</b></td><td>${a?`<input type="number" value="${p.min}" style="width:64px" onchange="updP('${p.code}',{min:+this.value})">`:p.min}</td>${rol!='Vendedor'?`<td>${mon(p.cost,p.moneda)}</td>`:''}<td>${mon(p.price,p.moneda)}</td>${a?`<td><button onclick="ed='${p.code}';draw()">Editar</button> <button onclick="ajuste('${p.code}')">Ajustar</button></td>`:''}</tr>`).join('')}
function fs(){$('#tb').innerHTML=rows($('#q').value)}
function addP(){const v=i=>$('#np'+i).value.trim(),c=v(0);if(!c||!v(1)||v(7)===''){alert('Completá al menos código, nombre y precio.');return}if(pf(c)){alert('Ya existe un repuesto con ese código.');return}const s=+v(4)||0;run(async()=>{chk(await sb.from('productos').insert({code:c,name:v(1),cat:v(2),loc:v(3),stock:s,min:+v(5)||0,cost:+v(6)||0,price:+v(7),prov:v(8),moneda:$('#np9').value}));if(s)chk(await sb.from('movimientos').insert({code:c,tipo:'Entrada',cant:s,motivo:'Alta manual / stock inicial',usuario:U.nombre}))})}

function addCI(){const c=$('#cp').value,q=+$('#cq').value,k=+$('#cc').value;if(q<1||k<0)return;cd.items.push({code:c,q,cost:k});if(!cd.prov)cd.prov=pf(c).prov;draw()}
function editCard(){const p=pf(ed),e=(i,v,w,t)=>`<input id="ep${i}" type="${t||'text'}" value="${String(v).replace(/"/g,'&quot;')}" style="width:${w}">`;return`<div class="card" style="border-color:var(--a)"><h2>Editar repuesto ${p.code}</h2><div class="f"><label>Código${e(0,p.code,'90px')}</label><label>Nombre${e(1,p.name,'180px')}</label><label>Categoría${e(2,p.cat,'110px')}</label><label>Ubicación${e(3,p.loc,'70px')}</label><label>Mínimo${e(5,p.min,'70px','number')}</label><label>Costo${e(6,p.cost,'90px','number')}</label><label>Precio${e(7,p.price,'90px','number')}</label><label>Proveedor${e(8,p.prov,'130px')}</label><label>Moneda<select id="ep9"><option value="ARS" ${p.moneda=='ARS'?'selected':''}>Pesos</option><option value="USD" ${p.moneda=='USD'?'selected':''}>Dólares</option></select></label><button class="p" onclick="saveP()">Guardar</button><button onclick="ed=null;draw()">Cancelar</button></div><small>El stock se corrige con "Ajustar" para que quede registrado.</small></div>`}
function saveP(){const v=i=>$('#ep'+i).value.trim(),p=pf(ed),n=v(0);if(!n||!v(1)||v(7)===''){alert('Completá código, nombre y precio.');return}if(n!=p.code&&pf(n)){alert('Ya existe un repuesto con ese código.');return}const o=p.code;ed=null;run(async()=>{if(n!=o)chk(await sb.rpc('renombrar_codigo',{p_old:o,p_new:n}));chk(await sb.from('productos').update({name:v(1),cat:v(2),loc:v(3),min:+v(5)||0,cost:+v(6)||0,price:+v(7),prov:v(8),moneda:$('#ep9').value}).eq('code',n))})}
function addC(){if(!cd.items.length||!cd.prov.trim()){alert('Agregá al menos un artículo e indicá el proveedor.');return}const d=cd;cd={prov:'',pago:PAGOS[0],plazo:PLAZOS[3],items:[]};run(async()=>chk(await sb.from('compras').insert({prov:d.prov.trim(),items:d.items,pago:d.pago,plazo:d.plazo,usuario:U.nombre})))}
function pedir(c,q){run(async()=>{chk(await sb.from('compras').insert({prov:pf(c).prov||'A definir',items:[{code:c,q,cost:pf(c).cost,moneda:pf(c).moneda}],pago:PAGOS[0],plazo:PLAZOS[3],usuario:U.nombre}));alert('Orden de compra creada (ver Compras).')})}
function recibir(id){run(async()=>{const r=chk(await sb.rpc('recibir_compra',{p_id:id}));if(r.data&&r.data.length)alert('Avisar a clientes que esperaban estos repuestos: '+r.data.join(', '))})}
function expX(){const ws=XLSX.utils.json_to_sheet(P.map(({code,name,cat,loc,stock,min,cost,price,prov,moneda})=>({code,name,cat,loc,stock,min,cost,price,prov,moneda}))),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Stock');XLSX.writeFile(wb,'stock-rama.xlsx')}
function impX(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>run(async()=>{const wb=XLSX.read(e.target.result,{type:'array'}),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]),er=[],rows=[],mv=[];rs.forEach((x,i)=>{if(!x.code||!x.name||isNaN(+x.stock)||isNaN(+x.price)){er.push('Fila '+(i+2)+': faltan datos');return}const c=String(x.code),o={code:c,name:String(x.name),cat:String(x.cat||''),loc:String(x.loc||''),stock:+x.stock,min:+x.min||0,cost:+x.cost||0,price:+x.price,prov:String(x.prov||''),moneda:String(x.moneda||'ARS').toUpperCase()=='USD'?'USD':'ARS'},p=pf(c);mv.push({code:c,tipo:p?'Ajuste':'Entrada',cant:o.stock-(p?p.stock:0),motivo:p?'Importación Excel':'Alta por importación',usuario:U.nombre});rows.push(o)});for(let i=0;i<rows.length;i+=200)chk(await sb.from('productos').upsert(rows.slice(i,i+200),{onConflict:'code'}));const mm=mv.filter(m=>m.cant);if(mm.length)chk(await sb.from('movimientos').insert(mm));alert('Importadas: '+rows.length+(er.length?'\nErrores:\n'+er.slice(0,8).join('\n'):''))});r.readAsArrayBuffer(f)}
const chk=r=>{if(r&&r.error)throw new Error(r.error.message);return r};
async function run(fn){try{await fn()}catch(e){alert(e.message||e)}await load();draw()}
const upd=(t,id,o)=>run(async()=>chk(await sb.from(t).update(o).eq('id',id))),updP=(c,o)=>run(async()=>chk(await sb.from('productos').update(o).eq('code',c)));
async function load(){const g=t=>sb.from(t).select('*').order('id',{ascending:false});const [p,q,f,c,cb,m,cf,ci]=await Promise.all([sb.from('productos').select('*').order('code'),g('cotizaciones'),g('faltantes'),g('compras'),g('cobros'),g('movimientos'),sb.from('config').select('*').eq('id',1).maybeSingle(),sb.from('clientes').select('*').order('nombre')]);const L=r=>(r.data||[]).map(cl);P=L(p);TC=+(cf.data&&cf.data.tc_usd)||1;CLI=L(ci);
Q=L(q).map(x=>({id:x.id,f:fd(x.fecha),cli:x.cliente,items:x.items,t:x.total,pago:x.pago,plazo:x.plazo,valid:x.valid,nota:x.nota,est:x.estado,u:x.usuario,cid:x.cliente_id,iva:x.iva,neto:x.neto,tc:x.tc,doc:x.doc_estado,fact:x.factura_nro}));
F=L(f).map(x=>({id:x.id,f:fd(x.fecha),cli:x.cliente,code:x.code,q:x.cant,pago:x.pago,sena:x.sena,plazo:x.plazo,est:x.estado}));
C=L(c).map(x=>({id:x.id,f:fd(x.fecha),prov:x.prov,items:x.items,pago:x.pago,plazo:x.plazo,est:x.estado,pg:x.pg}));
CB=L(cb).map(x=>({id:x.id,f:fd(x.fecha),cli:x.cliente,q:x.cotiz_id,pago:x.pago,t:x.total,est:x.estado}));
M=L(m).map(x=>({f:fd(x.fecha),code:x.code,tipo:x.tipo,q:x.cant,mot:x.motivo,u:x.usuario}))}
function showLogin(msg){$('#who').innerHTML='';$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>Stock Rama 4.0 — Ingresar</h2>${msg?`<p class="rd">${msg}</p>`:''}<div class="f" style="flex-direction:column;align-items:stretch"><label>Email<input id="lm" type="email" autocomplete="username"></label><label>Contraseña<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"></label><button class="p" onclick="login()">Ingresar</button></div></div>`}
async function login(){const r=await sb.auth.signInWithPassword({email:$('#lm').value.trim(),password:$('#lp').value});if(r.error){showLogin('Email o contraseña incorrectos');return}init()}
async function init(){const s=(await sb.auth.getSession()).data.session;if(!s){showLogin();return}const r=await sb.from('profiles').select('nombre,rol,activo').eq('id',s.user.id).maybeSingle();if(!r.data||!r.data.activo){await sb.auth.signOut();showLogin('Tu usuario no tiene acceso. Pedile al Administrador que lo habilite.');return}U={id:s.user.id,nombre:r.data.nombre||s.user.email,rol:r.data.rol};rol=U.rol;tab=R[rol][0];$('#who').innerHTML=`<small>${esc(U.nombre)} · ${rol}</small> <button onclick="miClave()">Mi contraseña</button> <button onclick="salir()">Salir</button>`;$('#app').textContent='Cargando…';await load();draw()}
async function salir(){await sb.auth.signOut();U=null;showLogin()}
async function miClave(){const p=prompt('Nueva contraseña (mínimo 8 caracteres)');if(!p)return;if(p.length<8){alert('Mínimo 8 caracteres');return}const r=await sb.auth.updateUser({password:p});alert(r.error?r.error.message:'Contraseña actualizada')}
async function adm(b){const r=await sb.functions.invoke('admin-usuarios',{body:b});if(r.error){let m=r.error.message;try{const j=await r.error.context.json();m=j.error||m}catch(e){}throw new Error(m)}return r.data}
V.Usuarios=()=>`<div class="card"><h2>Nuevo usuario</h2><div class="f"><label>Email de ingreso<input id="ue" type="email" placeholder="vendedor@tulocal.com"></label><label>Nombre<input id="un"></label><label>Perfil<select id="ur"><option>Vendedor</option><option>Caja</option><option>Administrador</option></select></label><label>Contraseña (mín. 8)<input id="up"></label><button class="p" onclick="crearU()">Crear</button></div><small>Si la persona no tiene email podés usar uno con formato válido (ej. juan@ramarepuestos.com); solo se usa para ingresar.</small></div><div class="card"><h2>Usuarios</h2><div class="w" id="us">Cargando…</div></div>`;
async function loadUs(){try{const d=await adm({accion:'listar'});$('#us').innerHTML=`<table><tr><th>Nombre</th><th>Email</th><th>Perfil</th><th>Estado</th><th></th></tr>${d.usuarios.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.email)}</td><td><select onchange="editU('${u.id}',{rol:this.value})">${opts(['Administrador','Vendedor','Caja'],u.rol)}</select></td><td>${u.activo?'<span class="bd gn">Activo</span>':'<span class="bd rd">Desactivado</span>'}</td><td><button onclick="editU('${u.id}',{activo:${!u.activo}})">${u.activo?'Desactivar':'Activar'}</button> <button onclick="claveU('${u.id}')">Cambiar clave</button></td></tr>`).join('')}</table>`}catch(e){$('#us').textContent=e.message}}
async function crearU(){const v=i=>$('#u'+i).value.trim();try{await adm({accion:'crear',email:v('e'),nombre:v('n'),rol:v('r'),password:v('p')});alert('Usuario creado');draw()}catch(e){alert(e.message)}}
async function editU(id,c){try{await adm({accion:'editar',id,...c})}catch(e){alert(e.message)}loadUs()}
async function claveU(id){const p=prompt('Nueva contraseña (mínimo 8 caracteres)');if(!p)return;try{await adm({accion:'clave',id,password:p});alert('Contraseña cambiada')}catch(e){alert(e.message)}}
const EMPRESA='Stock Rama',DOCS=['Creada','Enviada','Facturada'],IVAS=[0,10.5,21],CONDIVA=['Consumidor Final','Responsable Inscripto','Monotributista','Exento'];
const cv=p=>p&&p.moneda=='USD'?TC:1,mon=(n,m)=>m=='USD'?'US$ '+Number(n).toLocaleString('es-AR',{maximumFractionDigits:2}):money(n),unesc=t=>String(t).replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'),ivaT=n=>String(n).replace('.',',')+'%';
const calc=(items,iva,tc)=>{const neto=items.reduce((s,i)=>s+i.q*i.price*(i.moneda=='USD'?tc:1),0),m=neto*iva/100;return{neto,iva:m,total:neto+m}};
const tcCard=()=>`<div class="card"><div class="f"><label>Cotización del dólar ($ por US$ 1)${rol=='Administrador'?`<input id="tcv" type="number" step="0.01" value="${TC}" style="width:130px">`:`<b>${money(TC)}</b>`}</label>${rol=='Administrador'?'<button onclick="saveTC()">Guardar</button>':''}<small>Convierte a pesos los productos en dólares. Cada cotización guarda el valor usado al emitirla.</small></div></div>`;
function saveTC(){const v=+$('#tcv').value;if(!(v>0)){alert('Ingresá un valor válido.');return}run(async()=>chk(await sb.from('config').update({tc_usd:v,actualizado:new Date().toISOString()}).eq('id',1)))}

V.Cotizar=()=>{dr.iva=dr.iva??21;const k=calc(dr.items,dr.iva,TC);return`<div class="card"><h2>Nueva cotización</h2><div class="f"><label>Cliente<input id="dc" list="cls" value="${esc(dr.cli)}" oninput="dr.cli=this.value" placeholder="Elegí o escribí un cliente"></label><datalist id="cls">${CLI.map(c=>`<option value="${c.nombre}">`).join('')}</datalist><button onclick="go('Clientes')">Clientes</button></div><div class="f"><label>Repuesto<select id="dp">${popts()}</select></label><label>Cant.<input id="dq" type="number" min="1" value="1" style="width:70px"></label><button onclick="addI()">+ Agregar</button></div>
<div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Precio unit.</th><th>Disponible</th><th>Subtotal</th><th></th></tr>${dr.items.map((i,n)=>{const p=pf(i.code);return`<tr><td>${p.name}</td><td>${i.q}</td><td>${i.moneda=='USD'?'US$ ':'$ '}<input type="number" step="0.01" value="${i.price}" style="width:90px" onchange="dr.items[${n}].price=+this.value;draw()"></td><td class="${p.stock<i.q?'rd':'gn'}">${p.stock<i.q?'Faltan '+(i.q-Math.max(p.stock,0)):'En stock ('+p.stock+')'}</td><td>${money(i.q*i.price*(i.moneda=='USD'?TC:1))}</td><td><button onclick="dr.items.splice(${n},1);draw()">✕</button></td></tr>`}).join('')}
<tr><td colspan=4>Subtotal neto</td><td colspan=2>${money(k.neto)}</td></tr><tr><td colspan=4>IVA <select onchange="dr.iva=+this.value;draw()">${IVAS.map(x=>`<option value="${x}" ${x==dr.iva?'selected':''}>${ivaT(x)}</option>`).join('')}</select></td><td colspan=2>${money(k.iva)}</td></tr><tr><td colspan=4><b>Total</b></td><td colspan=2><b>${money(k.total)}</b></td></tr></table></div>${dr.items.some(i=>i.moneda=='USD')?`<small>Dólar tomado a ${money(TC)}.</small>`:''}<br>
<h2>Acuerdo con el cliente <small>(obligatorio)</small></h2><div class="f"><label>Forma de pago<select onchange="dr.pago=this.value"><option value="">— elegir —</option>${opts(PAGOS,dr.pago)}</select></label><label>Plazo de entrega<select onchange="dr.plazo=this.value"><option value="">— elegir —</option>${opts(PLAZOS,dr.plazo)}</select></label><label>Validez<input value="${dr.valid}" oninput="dr.valid=this.value" style="width:110px"></label></div><label style="display:block"><small>Condiciones / descuentos acordados</small><textarea style="width:100%" rows="2" oninput="dr.nota=this.value">${esc(dr.nota)}</textarea></label><br><button class="p" onclick="emit()">Emitir cotización</button></div>
<div class="card"><h2>Cotizaciones</h2><div class="w"><table style="min-width:900px"><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Acuerdo</th><th>Venta</th><th>Documento</th><th></th></tr>${Q.map(q=>`<tr><td>${q.id}</td><td>${q.f}</td><td>${q.cli}</td><td>${money(q.t)}<br><small>IVA ${ivaT(q.iva)}</small></td><td><small>${q.pago} · ${q.plazo} · válida ${q.valid}${q.nota?' · '+q.nota:''}<br>por ${q.u}</small></td><td><span class="bd">${q.est}</span><br>${q.est=='Emitida'?`<button onclick="vender(${q.id})">Vender</button> <button onclick="perder(${q.id})">Perdida</button>`:''}</td><td><select onchange="setDoc(${q.id},this.value)">${opts(DOCS,q.doc)}</select>${q.fact?`<br><small>Factura ${q.fact}</small>`:''}</td><td><button onclick="imprimir(${q.id})">🖨 Imprimir / PDF</button><br><button onclick="bajarDoc(${q.id})">⬇ Word editable</button>${rol=='Administrador'?`<br><button onclick="delQ(${q.id})">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>Sin cotizaciones</td></tr>'}</table></div></div>`};

function emit(){dr.cli=$('#dc').value.trim();if(!dr.cli||!dr.items.length||!dr.pago||!dr.plazo){alert('Completá cliente, al menos un repuesto, forma de pago y plazo de entrega.');return}const d=dr,iva=d.iva??21,k=calc(d.items,iva,TC),c=CLI.find(x=>x.nombre==esc(d.cli)),fl=d.items.filter(i=>pf(i.code).stock<i.q).map(i=>({cliente:d.cli,code:i.code,cant:i.q-Math.max(pf(i.code).stock,0),pago:d.pago,plazo:d.plazo,usuario:U.nombre}));dr={cli:'',items:[],pago:'',plazo:'',valid:'7 días',nota:'',iva:21};run(async()=>{chk(await sb.from('cotizaciones').insert({cliente:d.cli,cliente_id:c?c.id:null,items:d.items,neto:k.neto,iva,total:k.total,tc:TC,pago:d.pago,plazo:d.plazo,valid:d.valid,nota:d.nota,usuario:U.nombre}));if(fl.length){chk(await sb.from('faltantes').insert(fl));alert('Cotización emitida. '+fl.length+' repuesto(s) sin stock suficiente se registraron en Faltantes.')}})}

function docHTML(q,tool,img){img=img||LOGO;const c=CLI.find(x=>x.id==q.cid),k=calc(q.items,q.iva,q.tc),usd=q.items.some(i=>i.moneda=='USD'),rows=q.items.map(i=>{const pr=pf(i.code)||{name:i.code};return`<tr><td>${i.code}</td><td>${pr.name}</td><td class="r">${i.q}</td><td class="r">${mon(i.price,i.moneda)}</td><td class="r">${money(i.q*i.price*(i.moneda=='USD'?q.tc:1))}</td></tr>`}).join('');
return`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Presupuesto ${q.id}</title><style>body{font:14px Arial,sans-serif;color:#111;margin:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:6px;text-align:left}th{background:#eee}.r{text-align:right}@media print{.np{display:none}}</style></head><body>${tool?'<div class="np"><button onclick="print()" style="padding:8px 14px">Imprimir / Guardar como PDF</button></div>':''}<table border="0" cellspacing="0" cellpadding="4" width="100%" style="margin-bottom:10px"><tr><td style="border:0" width="170"><img src="${img}" width="160" alt="AGM Agro-Vial"></td><td style="border:0;font-size:13px"><b style="font-size:17px">EL ALGARROBAL</b><br>C.U.I.T.: 30-68737645-1<br>I.V.A.: Responsable Inscripto<br>Domicilio: LOTE 570, PARQUE INDUSTRIAL PERICO, ARGENTINA ARGENTINA<br>Teléfonos: 0388-5016160 / 0388-4560051<br>Mail: adm@agmagrovial.com.ar</td></tr></table><h3>Presupuesto N° ${q.id} — ${q.f}</h3><p><b>Cliente:</b> ${q.cli}${c?`<br>CUIT/DNI: ${c.cuit||'—'} · ${c.condicion_iva}<br>${c.direccion||''} ${c.telefono||''}`:''}</p><table border="1" cellspacing="0" cellpadding="6" width="100%"><tr><th width="17%" align="left">Código</th><th align="left">Descripción</th><th width="11%" align="right">Cant.</th><th width="17%" align="right">Precio unit.</th><th width="17%" align="right">Subtotal</th></tr>${rows}</table><br><table border="1" cellspacing="0" cellpadding="6" width="320" align="right"><tr><td>Subtotal neto</td><td class="r">${money(k.neto)}</td></tr><tr><td>IVA ${ivaT(q.iva)}</td><td class="r">${money(k.iva)}</td></tr><tr><th>TOTAL</th><th class="r">${money(k.total)}</th></tr></table>${usd?`<p style="font-size:12px">Importes en dólares convertidos a $${q.tc} por US$ 1.</p>`:''}<p><b>Forma de pago:</b> ${q.pago}<br><b>Plazo de entrega:</b> ${q.plazo}<br><b>Validez:</b> ${q.valid}${q.nota?`<br><b>Condiciones:</b> ${q.nota}`:''}${q.fact?`<br><b>Factura N°:</b> ${q.fact}`:''}</p></body></html>`}
function imprimir(id){const q=Q.find(x=>x.id==id),w=window.open('','_blank');if(!w){alert('El navegador bloqueó la ventana. Permití las ventanas emergentes para imprimir.');return}w.document.write(docHTML(q,true));w.document.close()}
function bajarDoc(id){const q=Q.find(x=>x.id==id),h=docHTML(q,false,'logo.png'),w=t=>t.replace(/.{76}/g,'$&\r\n'),e=t=>{let r='';new TextEncoder().encode(t).forEach(c=>r+=String.fromCharCode(c));return w(btoa(r))},m=['MIME-Version: 1.0','Content-Type: multipart/related; boundary="rama"; type="text/html"','','--rama','Content-Type: text/html; charset="utf-8"','Content-Transfer-Encoding: base64','Content-Location: presupuesto.htm','',e(h),'--rama','Content-Type: image/png','Content-Transfer-Encoding: base64','Content-Location: logo.png','',w(LOGO.split(',')[1]),'--rama--',''].join('\r\n'),bl=new Blob([m],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='presupuesto-'+q.id+'.doc';document.body.appendChild(a);a.click();a.remove()}

V.Compras=()=>{const cj=rol=='Caja';return`${cj?'':`<div class="card"><h2>${cdId?'Editando orden N° '+cdId:'Nueva orden de compra'}</h2><div class="f"><label>Repuesto<select id="cp" onchange="cf()">${popts()}</select></label><label>Cant.<input id="cq" type="number" min="1" value="1" style="width:70px"></label><label>Costo unit.<input id="cc" type="number" step="0.01" style="width:100px" value="${(P[0]||{cost:0}).cost}"></label><button onclick="addCI()">+ Agregar</button></div><div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Costo</th><th>Subtotal ($)</th><th></th></tr>${cd.items.map((i,n)=>`<tr><td>${pf(i.code).name}</td><td><input type="number" min="1" value="${i.q}" style="width:70px" onchange="cd.items[${n}].q=+this.value;draw()"></td><td>${mon(i.cost,i.moneda)}</td><td>${money(i.q*i.cost*(i.moneda=='USD'?TC:1))}</td><td><button onclick="cd.items.splice(${n},1);draw()">✕</button></td></tr>`).join('')}<tr><td colspan=3><b>Total</b></td><td colspan=2><b>${money(tot(cd))}</b></td></tr></table></div><br><div class="f"><label>Proveedor<input value="${esc(cd.prov)}" oninput="cd.prov=this.value"></label><label>Pago pactado<select onchange="cd.pago=this.value">${opts(PAGOS,cd.pago)}</select></label><label>Plazo<select onchange="cd.plazo=this.value">${opts(PLAZOS,cd.plazo)}</select></label><button class="p" onclick="addC()">${cdId?'Guardar cambios':'Crear orden'}</button>${cdId?'<button onclick="cancelC()">Cancelar edición</button>':''}</div></div>`}<div class="card"><h2>Órdenes de compra</h2><div class="w"><table><tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Artículos</th><th>Total</th><th>Pago / plazo</th><th>Estado</th><th></th></tr>${C.map(c=>`<tr><td>${c.id}</td><td>${c.f}</td><td>${c.prov}</td><td>${its(c)}</td><td>${money(tot(c))}</td><td><small>${c.pago} · ${c.plazo}</small></td><td><span class="bd">${c.est}</span> <span class="bd">${c.pg}</span></td><td>${c.est=='Pedida'&&!cj?`<button onclick="editC(${c.id})">Editar</button> <button onclick="recibir(${c.id})">Recibir</button>`:''}${rol=='Administrador'?` <button onclick="delC(${c.id})">🗑 Eliminar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>Sin órdenes</td></tr>'}</table></div></div>`};
function addCI(){const c=$('#cp').value,q=+$('#cq').value,k=+$('#cc').value;if(q<1||k<0)return;cd.items.push({code:c,q,cost:k,moneda:pf(c).moneda});if(!cd.prov)cd.prov=unesc(pf(c).prov);draw()}
function editC(id){const c=C.find(x=>x.id==id);cd={prov:unesc(c.prov),pago:c.pago,plazo:c.plazo,items:c.items.map(i=>({...i}))};cdId=id;draw();scrollTo(0,0)}
function cancelC(){cd={prov:'',pago:PAGOS[0],plazo:PLAZOS[3],items:[]};cdId=null;draw()}
function addC(){if(!cd.items.length||!cd.prov.trim()){alert('Agregá al menos un artículo e indicá el proveedor.');return}const d=cd,id=cdId;cd={prov:'',pago:PAGOS[0],plazo:PLAZOS[3],items:[]};cdId=null;run(async()=>{if(id)chk(await sb.from('compras').update({prov:d.prov.trim(),items:d.items,pago:d.pago,plazo:d.plazo}).eq('id',id).eq('estado','Pedida'));else chk(await sb.from('compras').insert({prov:d.prov.trim(),items:d.items,pago:d.pago,plazo:d.plazo,usuario:U.nombre}))})}

V.Clientes=()=>{const ed=rol!='Caja',c=ce?CLI.find(x=>x.id==ce):null,v=k=>c?esc(unesc(c[k]||'')):'',i=(k,l,w)=>`<label>${l}<input id="c${k}" value="${v(k)}" style="${w?'width:'+w:''}"></label>`;
return`${ed?`<div class="card"><h2>${c?'Editar cliente':'Nuevo cliente'}</h2><div class="f">${i('nombre','Nombre / Razón social')}${i('cuit','CUIT / DNI','140px')}${i('telefono','Teléfono','130px')}${i('email','Email')}</div><div class="f">${i('direccion','Dirección')}<label>Condición IVA<select id="ccondicion_iva">${opts(CONDIVA,c&&c.condicion_iva)}</select></label>${i('notas','Notas')}<button class="p" onclick="saveCl()">${c?'Guardar cambios':'Agregar cliente'}</button>${c?'<button onclick="ce=null;draw()">Cancelar</button>':''}</div></div>`:''}<div class="card"><div class="f"><label>Buscar<input value="${esc(cq)}" oninput="cq=this.value;$('#tcl').innerHTML=rowsCl()" placeholder="nombre, CUIT, teléfono"></label></div><div class="w"><table><thead><tr><th>Nombre</th><th>CUIT / DNI</th><th>Contacto</th><th>Condición IVA</th><th></th></tr></thead><tbody id="tcl">${rowsCl()}</tbody></table></div></div>`};
function rowsCl(){const q=cq.toLowerCase(),ed=rol!='Caja';return CLI.filter(c=>(c.nombre+c.cuit+c.telefono+c.email).toLowerCase().includes(q)).map(c=>`<tr><td><b>${c.nombre}</b><br><small>${c.direccion}</small></td><td>${c.cuit}</td><td>${c.telefono}<br><small>${c.email}</small></td><td>${c.condicion_iva}</td><td>${ed?`<button onclick="ce=${c.id};draw();scrollTo(0,0)">Editar</button>`:''} ${rol=='Administrador'?`<button onclick="delCl(${c.id})">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Sin clientes cargados</td></tr>'}
function saveCl(){const v=k=>$('#c'+k).value.trim(),o={nombre:v('nombre'),cuit:v('cuit'),telefono:v('telefono'),email:v('email'),direccion:v('direccion'),condicion_iva:v('condicion_iva'),notas:v('notas')};if(!o.nombre){alert('Ingresá el nombre del cliente.');return}const id=ce;ce=null;run(async()=>id?chk(await sb.from('clientes').update(o).eq('id',id)):chk(await sb.from('clientes').insert(o)))}
function delCl(id){if(!confirm('¿Eliminar este cliente? Sus cotizaciones se conservan.'))return;run(async()=>chk(await sb.from('clientes').delete().eq('id',id)))}

function delQ(id){const q=Q.find(x=>x.id==id);if(!confirm('¿Eliminar la cotización N° '+id+'?'+(q.est=='Vendida'?'\n\nYa estaba vendida: se devolverá al stock lo que se descontó y se quitará su cobro.':'')))return;run(async()=>chk(await sb.rpc('eliminar_cotizacion',{p_id:id})))}
function delC(id){const c=C.find(x=>x.id==id);if(!confirm('¿Eliminar la orden de compra N° '+id+'?'+(c.est=='Recibida'?'\n\nYa estaba recibida: se descontará del stock lo que había ingresado.':'')))return;run(async()=>chk(await sb.rpc('eliminar_compra',{p_id:id})))}

init();

</script></body></html>
