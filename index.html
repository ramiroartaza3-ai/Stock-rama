<script>
const $=s=>document.querySelector(s),money=n=>'$'+Math.round(n).toLocaleString('es-AR'),hoy=()=>new Date().toLocaleDateString('es-AR');

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),cl=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,typeof v=='string'&&k!='code'?esc(v):v])),fd=d=>new Date(d).toLocaleDateString('es-AR');

<div class="card"><h2>Stock vs. mínimo <small>(barra = stock, línea roja = mínimo)</small></h2>${P.map(p=>{const m=Math.max(p.stock,p.min)*1.25;return`<div class="br"><i>${p.name}</i><div class="tr"><u style="width:${p.stock/m*100}%;background:${p.stock<=p.min?'var(--r)':'var(--a)'}"></u><s style="left:${p.min/m*100}%"></s></div><b>${p.stock}/${p.min}</b></div>`}).join('')}</div>

Stock(){const a=rol=='Administrador';return`${tcCard()}${a&&ed&&pf(ed)?editCard():''}${rol!='Caja'?`<div class="card"><h2>Nuevo repuesto</h2><div class="f"><label>Código<input id="np0" style="width:90px"></label><label>Nombre<input id="np1"></label><label>Categoría<input id="np2" style="width:110px"></label><label>Ubicación<input id="np3" style="width:70px"></label><label>Stock inicial<input id="np4" type="number" value="0" style="width:80px"></label><label>Mínimo<input id="np5" type="number" value="0" style="width:70px"></label><label>Costo<input id="np6" type="number" style="width:90px"></label><label>Precio<input id="np7" type="number" style="width:90px"></label><label>Proveedor<input id="np8" style="width:130px"></label><label>Moneda<select id="np9"><option value="ARS">Pesos</option><option value="USD">Dólares</option></select></label><button class="p" onclick="addP()">Agregar</button></div></div>`:''}<div class="card"><div class="f"><label>Buscar<input id="q" oninput="fs()" placeholder="código, nombre, categoría"></label>${a?`<button onclick="expX()">⬇ Exportar Excel</button><label>Importar Excel<input type="file" accept=".xlsx,.xls,.csv" onchange="impX(this)"></label>`:''}</div><small>Columnas para importar: code, name, cat, loc, stock, min, cost, price, prov, moneda (ARS o USD)</small><div class="w"><table><thead><tr><th>Código</th><th>Repuesto</th><th>Ubic.</th><th>Stock</th><th>Mín.</th>${rol!='Vendedor'?'<th>Costo</th>':''}<th>Precio</th>${a?'<th></th>':''}</tr></thead><tbody id="tb">${rows('')}</tbody></table></div></div>`},
Cotizar(){return`<div class="card"><h2>Nueva cotización</h2><div class="f"><label>Cliente<input id="dc" value="${dr.cli}" oninput="dr.cli=this.value" placeholder="Nombre / teléfono"></label><label>Repuesto<select id="dp">${popts()}</select></label><label>Cant.<input id="dq" type="number" min="1" value="1" style="width:70px"></label><button onclick="addI()">+ Agregar</button></div>
<div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Disponible</th><th>Subtotal</th><th></th></tr>${dr.items.map((i,n)=>{const p=pf(i.code);return`<tr><td>${p.name}</td><td>${i.q}</td><td class="${p.stock<i.q?'rd':'gn'}">${p.stock<i.q?'Faltan '+(i.q-Math.max(p.stock,0)):'En stock ('+p.stock+')'}</td><td>${money(p.price*i.q)}</td><td><button onclick="dr.items.splice(${n},1);draw()">✕</button></td></tr>`}).join('')}<tr><td colspan=3><b>Total</b></td><td><b>${money(dr.items.reduce((s,i)=>s+pf(i.code).price*i.q,0))}</b></td><td></td></tr></table></div><br>
<h2>Acuerdo con el cliente <small>(obligatorio)</small></h2><div class="f"><label>Forma de pago<select onchange="dr.pago=this.value"><option value="">— elegir —</option>${opts(PAGOS,dr.pago)}</select></label><label>Plazo de entrega<select onchange="dr.plazo=this.value"><option value="">— elegir —</option>${opts(PLAZOS,dr.plazo)}</select></label><label>Validez<input value="${dr.valid}" oninput="dr.valid=this.value" style="width:110px"></label></div><label style="display:block"><small>Condiciones / descuentos acordados</small><textarea style="width:100%" rows="2" oninput="dr.nota=this.value">${dr.nota}</textarea></label><br><button class="p" onclick="emit()">Emitir cotización</button></div>
<div class="card"><h2>Cotizaciones</h2><div class="w"><table><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Acuerdo</th><th>Estado</th><th></th></tr>${Q.map(q=>`<tr><td>${q.id}</td><td>${q.f}</td><td>${q.cli}</td><td>${money(q.t)}</td><td><small>${q.pago} · ${q.plazo} · válida ${q.valid}${q.nota?' · '+q.nota:''}<br>por ${q.u}</small></td><td><span class="bd">${q.est}</span></td><td>${q.est=='Emitida'?`<button onclick="vender(${q.id})">Vender</button> <button onclick="perder(${q.id})">Perdida</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin cotizaciones</td></tr>'}</table></div></div>`},
Faltantes(){return`<div class="card"><h2>Registrar faltante (interno)</h2><div class="f"><label>Cliente<input id="fc"></label><label>Repuesto<select id="fp">${popts()}</select></label><label>Cant. pedida<input id="fq" type="number" value="1" style="width:80px"></label><label>Pago acordado<select id="fg">${opts(PAGOS)}</select></label><label>Seña $<input id="fs" type="number" value="0" style="width:90px"></label><label>Plazo prometido<select id="fz">${opts(PLAZOS)}</select></label><button class="p" onclick="addF()">Registrar</button></div></div>
<div class="card"><h2>Faltantes y pedidos pendientes</h2><div class="w"><table><tr><th>Fecha</th><th>Cliente</th><th>Repuesto</th><th>Pidió / faltó</th><th>Pago acordado</th><th>Seña</th><th>Plazo</th><th>Estado</th><th></th></tr>${F.map((f,n)=>`<tr><td>${f.f}</td><td>${f.cli}</td><td>${pf(f.code).name}</td><td>${f.q}</td><td>${f.pago}</td><td>${money(f.sena)}</td><td>${f.plazo}</td><td><span class="bd">${f.est}</span></td><td>${f.est=='Pendiente'?`<button onclick="upd('faltantes',${f.id},{estado:'Resuelto'})">Resolver</button>`:''}</td></tr>`).join('')||'<tr><td colspan=9>Sin faltantes</td></tr>'}</table></div></div>`},
Compras(){const cj=rol=='Caja';return`${cj?'':`<div class="card"><h2>Nueva orden de compra</h2><div class="f"><label>Repuesto<select id="cp" onchange="cf()">${popts()}</select></label><label>Cant.<input id="cq" type="number" min="1" value="1" style="width:70px"></label><label>Costo unit.<input id="cc" type="number" style="width:100px" value="${(P[0]||{cost:0}).cost}"></label><button onclick="addCI()">+ Agregar</button></div><div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Costo</th><th>Subtotal</th><th></th></tr>${cd.items.map((i,n)=>`<tr><td>${pf(i.code).name}</td><td>${i.q}</td><td>${money(i.cost)}</td><td>${money(i.q*i.cost)}</td><td><button onclick="cd.items.splice(${n},1);draw()">✕</button></td></tr>`).join('')}<tr><td colspan=3><b>Total</b></td><td colspan=2><b>${money(tot(cd))}</b></td></tr></table></div><br><div class="f"><label>Proveedor<input value="${cd.prov}" oninput="cd.prov=this.value"></label><label>Pago pactado<select onchange="cd.pago=this.value">${opts(PAGOS,cd.pago)}</select></label><label>Plazo<select onchange="cd.plazo=this.value">${opts(PLAZOS,cd.plazo)}</select></label><button class="p" onclick="addC()">Crear orden</button></div></div>`}<div class="card"><h2>Órdenes de compra</h2><div class="w"><table><tr><th>Fecha</th><th>Proveedor</th><th>Artículos</th><th>Total</th><th>Pago / plazo</th><th>Estado</th><th></th></tr>${C.map((c,n)=>`<tr><td>${c.f}</td><td>${c.prov}</td><td>${its(c)}</td><td>${money(tot(c))}</td><td><small>${c.pago} · ${c.plazo}</small></td><td><span class="bd">${c.est}</span> <span class="bd">${c.pg}</span></td><td>${c.est=='Pedida'&&!cj?`<button onclick="recibir(${c.id})">Recibir</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin órdenes</td></tr>'}</table></div></div>`},
Caja(){return`<div class="card"><h2>Cobros</h2><div class="w"><table><tr><th>Fecha</th><th>Cliente</th><th>Cotiz.</th><th>Forma de pago</th><th>Total</th><th>Estado</th><th></th></tr>${CB.map((c,n)=>`<tr><td>${c.f}</td><td>${c.cli}</td><td>${c.q}</td><td>${c.pago}</td><td>${money(c.t)}</td><td><span class="bd">${c.est}</span></td><td>${c.est=='Pendiente'?`<button onclick="upd('cobros',${c.id},{estado:'Cobrado'})">Cobrar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin cobros</td></tr>'}</table></div></div><div class="card"><h2>Pagos a proveedores</h2><div class="w"><table><tr><th>Fecha</th><th>Repuesto</th><th>Pago pactado</th><th>Total</th><th>Recepción</th><th>Pago</th><th></th></tr>${C.map((c,n)=>`<tr><td>${c.f}</td><td>${its(c)}</td><td>${c.pago}</td><td>${money(tot(c))}</td><td>${c.est}</td><td><span class="bd">${c.pg}</span></td><td>${c.pg=='Impago'?`<button onclick="upd('compras',${c.id},{pg:'Pagado'})">Registrar pago</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Sin compras</td></tr>'}</table></div></div>`},

function rows(f){f=f.toLowerCase();const a=rol=='Administrador';return P.filter(p=>(p.code+p.name+p.cat).toLowerCase().includes(f)).map(p=>`<tr><td>${p.code}</td><td>${p.name}<br><small>${p.cat} · ${p.prov}</small></td><td>${p.loc}</td><td class="${p.stock<=p.min?'rd':''}"><b>${p.stock}</b></td><td>${a?`<input type="number" value="${p.min}" style="width:64px" onchange="updP('${p.code}',{min:+this.value})">`:p.min}</td>${rol!='Vendedor'?`<td>${mon(p.cost,p.moneda)}</td>`:''}<td>${mon(p.price,p.moneda)}</td>${a?`<td><button onclick="ed='${p.code}';draw()">Editar</button> <button onclick="ajuste('${p.code}')">Ajustar</button></td>`:''}</tr>`).join('')}
function fs(){$('#tb').innerHTML=rows($('#q').value)}
function addP(){const v=i=>$('#np'+i).value.trim(),c=v(0);if(!c||!v(1)||v(7)===''){alert('Completá al menos código, nombre y precio.');return}if(pf(c)){alert('Ya existe un repuesto con ese código.');return}const s=+v(4)||0;run(async()=>{chk(await sb.from('productos').insert({code:c,name:v(1),cat:v(2),loc:v(3),stock:s,min:+v(5)||0,cost:+v(6)||0,price:+v(7),prov:v(8),moneda:$('#np9').value}));if(s)chk(await sb.from('movimientos').insert({code:c,tipo:'Entrada',cant:s,motivo:'Alta manual / stock inicial',usuario:U.nombre}))})}

const EMPRESA='Stock Rama',DOCS=['Creada','Enviada','Facturada'],IVAS=[0,10.5,21],CONDIVA=['Consumidor Final','Responsable Inscripto','Monotributista','Exento'];
const cv=p=>p&&p.moneda=='USD'?TC:1,mon=(n,m)=>m=='USD'?'US$ '+Number(n).toLocaleString('es-AR',{maximumFractionDigits:2}):money(n),unesc=t=>String(t).replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'),ivaT=n=>String(n).replace('.',',')+'%';

<div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Precio unit.</th><th>Disponible</th><th>Subtotal</th><th></th></tr>${dr.items.map((i,n)=>{const p=pf(i.code);return`<tr><td>${p.name}</td><td>${i.q}</td><td>${i.moneda=='USD'?'US$ ':'$ '}<input type="number" step="0.01" value="${i.price}" style="width:90px" onchange="dr.items[${n}].price=+this.value;draw()"></td><td class="${p.stock<i.q?'rd':'gn'}">${p.stock<i.q?'Faltan '+(i.q-Math.max(p.stock,0)):'En stock ('+p.stock+')'}</td><td>${money(i.q*i.price*(i.moneda=='USD'?TC:1))}</td><td><button onclick="dr.items.splice(${n},1);draw()">✕</button></td></tr>`}).join('')}
<tr><td colspan=4>Subtotal neto</td><td colspan=2>${money(k.neto)}</td></tr><tr><td colspan=4>IVA <select onchange="dr.iva=+this.value;draw()">${IVAS.map(x=>`<option value="${x}" ${x==dr.iva?'selected':''}>${ivaT(x)}</option>`).join('')}</select></td><td colspan=2>${money(k.iva)}</td></tr><tr><td colspan=4><b>Total</b></td><td colspan=2><b>${money(k.total)}</b></td></tr></table></div>${dr.items.some(i=>i.moneda=='USD')?`<small>Dólar tomado a ${money(TC)}.</small>`:''}<br>

V.Compras=()=>{const cj=rol=='Caja';return`${cj?'':`<div class="card"><h2>${cdId?'Editando orden N° '+cdId:'Nueva orden de compra'}</h2><div class="f"><label>Repuesto<select id="cp" onchange="cf()">${popts()}</select></label><label>Cant.<input id="cq" type="number" min="1" value="1" style="width:70px"></label><label>Costo unit.<input id="cc" type="number" step="0.01" style="width:100px" value="${(P[0]||{cost:0}).cost}"></label><button onclick="addCI()">+ Agregar</button></div><div class="w"><table><tr><th>Repuesto</th><th>Cant.</th><th>Costo</th><th>Subtotal ($)</th><th></th></tr>${cd.items.map((i,n)=>`<tr><td>${pf(i.code).name}</td><td><input type="number" min="1" value="${i.q}" style="width:70px" onchange="cd.items[${n}].q=+this.value;draw()"></td><td>${mon(i.cost,i.moneda)}</td><td>${money(i.q*i.cost*(i.moneda=='USD'?TC:1))}</td><td><button onclick="cd.items.splice(${n},1);draw()">✕</button></td></tr>`).join('')}<tr><td colspan=3><b>Total</b></td><td colspan=2><b>${money(tot(cd))}</b></td></tr></table></div><br><div class="f"><label>Proveedor<input value="${esc(cd.prov)}" oninput="cd.prov=this.value"></label><label>Pago pactado<select onchange="cd.pago=this.value">${opts(PAGOS,cd.pago)}</select></label><label>Plazo<select onchange="cd.plazo=this.value">${opts(PLAZOS,cd.plazo)}</select></label><button class="p" onclick="addC()">${cdId?'Guardar cambios':'Crear orden'}</button>${cdId?'<button onclick="cancelC()">Cancelar edición</button>':''}</div></div>`}<div class="card"><h2>Órdenes de compra</h2><div class="w"><table><tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Artículos</th><th>Total</th><th>Pago / plazo</th><th>Estado</th><th></th></tr>${C.map(c=>`<tr><td>${c.id}</td><td>${c.f}</td><td>${c.prov}</td><td>${its(c)}</td><td>${money(tot(c))}</td><td><small>${c.pago} · ${c.plazo}</small></td><td><span class="bd">${c.est}</span> <span class="bd">${c.pg}</span></td><td>${c.est=='Pedida'&&!cj?`<button onclick="editC(${c.id})">Editar</button> <button onclick="recibir(${c.id})">Recibir</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>Sin órdenes</td></tr>'}</table></div></div>`};
function addCI(){const c=$('#cp').value,q=+$('#cq').value,k=+$('#cc').value;if(q<1||k<0)return;cd.items.push({code:c,q,cost:k,moneda:pf(c).moneda});if(!cd.prov)cd.prov=unesc(pf(c).prov);draw()}
function editC(id){const c=C.find(x=>x.id==id);cd={prov:unesc(c.prov),pago:c.pago,plazo:c.plazo,items:c.items.map(i=>({...i}))};cdId=id;draw();scrollTo(0,0)}
function cancelC(){cd={prov:'',pago:PAGOS[0],plazo:PLAZOS[3],items:[]};cdId=null;draw()}
function addC(){if(!cd.items.length||!cd.prov.trim()){alert('Agregá al menos un artículo e indicá el proveedor.');return}const d=cd,id=cdId;cd={prov:'',pago:PAGOS[0],plazo:PLAZOS[3],items:[]};cdId=null;run(async()=>{if(id)chk(await sb.from('compras').update({prov:d.prov.trim(),items:d.items,pago:d.pago,plazo:d.plazo}).eq('id',id).eq('estado','Pedida'));else chk(await sb.from('compras').insert({prov:d.prov.trim(),items:d.items,pago:d.pago,plazo:d.plazo,usuario:U.nombre}))})}
/* ---- Clientes ---- */
let ce=null,cq='';
V.Clientes=()=>{const ed=rol!='Caja',c=ce?CLI.find(x=>x.id==ce):null,v=k=>c?esc(unesc(c[k]||'')):'',i=(k,l,w)=>`<label>${l}<input id="c${k}" value="${v(k)}" style="${w?'width:'+w:''}"></label>`;
return`${ed?`<div class="card"><h2>${c?'Editar cliente':'Nuevo cliente'}</h2><div class="f">${i('nombre','Nombre / Razón social')}${i('cuit','CUIT / DNI','140px')}${i('telefono','Teléfono','130px')}${i('email','Email')}</div><div class="f">${i('direccion','Dirección')}<label>Condición IVA<select id="ccondicion_iva">${opts(CONDIVA,c&&c.condicion_iva)}</select></label>${i('notas','Notas')}<button class="p" onclick="saveCl()">${c?'Guardar cambios':'Agregar cliente'}</button>${c?'<button onclick="ce=null;draw()">Cancelar</button>':''}</div></div>`:''}<div class="card"><div class="f"><label>Buscar<input value="${esc(cq)}" oninput="cq=this.value;$('#tcl').innerHTML=rowsCl()" placeholder="nombre, CUIT, teléfono"></label></div><div class="w"><table><thead><tr><th>Nombre</th><th>CUIT / DNI</th><th>Contacto</th><th>Condición IVA</th><th></th></tr></thead><tbody id="tcl">${rowsCl()}</tbody></table></div></div>`};
function rowsCl(){const q=cq.toLowerCase(),ed=rol!='Caja';return CLI.filter(c=>(c.nombre+c.cuit+c.telefono+c.email).toLowerCase().includes(q)).map(c=>`<tr><td><b>${c.nombre}</b><br><small>${c.direccion}</small></td><td>${c.cuit}</td><td>${c.telefono}<br><small>${c.email}</small></td><td>${c.condicion_iva}</td><td>${ed?`<button onclick="ce=${c.id};draw();scrollTo(0,0)">Editar</button>`:''} ${rol=='Administrador'?`<button onclick="delCl(${c.id})">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5>Sin clientes cargados</td></tr>'}
function saveCl(){const v=k=>$('#c'+k).value.trim(),o={nombre:v('nombre'),cuit:v('cuit'),telefono:v('telefono'),email:v('email'),direccion:v('direccion'),condicion_iva:v('condicion_iva'),notas:v('notas')};if(!o.nombre){alert('Ingresá el nombre del cliente.');return}const id=ce;ce=null;run(async()=>id?chk(await sb.from('clientes').update(o).eq('id',id)):chk(await sb.from('clientes').insert(o)))}
function delCl(id){if(!confirm('¿Eliminar este cliente? Sus cotizaciones se conservan.'))return;run(async()=>chk(await sb.from('clientes').delete().eq('id',id)))}

init();

</script></body></html>
